<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Payment link — Anastomosis.MD</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, sans-serif; color: #101418; background: #F7F3EB; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 520px); background: #fff; border: 1px solid #ddd6cc; border-radius: 16px; padding: clamp(24px, 6vw, 42px); box-shadow: 0 10px 30px #1014180d; }
    .brand { font-weight: 750; letter-spacing: -.03em; color: #1B4E5F; }
    h1 { margin: 28px 0 12px; font-size: clamp(26px, 6vw, 34px); letter-spacing: -.04em; line-height: 1.15; }
    p { line-height: 1.55; color: #455056; }
    #status { border-left: 3px solid #B5342A; padding: 4px 0 4px 14px; margin: 24px 0; color: #101418; }
    a { color: #1B4E5F; }
  </style>
<!-- APEX-07 Anastomosis.MD brand icons -->
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<!-- /APEX-07 brand icons -->
</head>
<body>
  <main>
    <div class="brand">Anastomosis.MD</div>
    <h1>Your secure payment link</h1>
    <p>Use this page to complete a Paddle payment or update your payment details.</p>
    <p id="status" role="status" aria-live="polite">Preparing your payment link…</p>
    <p>Need help? <a href="mailto:anastomosis.md@gmail.com">Contact support</a>.</p>
  </main>
  <script>
    // Public Paddle client-side token already used by the live dashboard.
    // Never put a server API key or webhook signing secret in this page.
    const CLIENT_TOKEN = 'live_61c415361a7b2cf950057b8d5f6';
    const status = document.getElementById('status');
    const hasPaymentLink = new URLSearchParams(window.location.search).has('_ptxn');
    function setStatus(message) { status.textContent = message; }
    function paymentScriptFailed() {
      setStatus('The payment window could not be loaded. Please try your link again or contact support.');
    }
    function startPaymentLink() {
      if (!hasPaymentLink) {
        setStatus('No payment link was found. Please open the link from your Paddle email, or contact support.');
        return;
      }
      if (!window.Paddle || typeof window.Paddle.Initialize !== 'function') {
        paymentScriptFailed();
        return;
      }
      try {
        setStatus('Opening the secure Paddle window. If it does not open, try your link again or contact support.');
        // Paddle.js automatically opens the transaction in _ptxn on initialization.
        // Do not redirect, remove the query string, or call Checkout.open with items.
        window.Paddle.Initialize({
          token: CLIENT_TOKEN,
          checkout: { settings: { displayMode: 'overlay', theme: 'light' } },
          eventCallback: function (event) {
            if (event && event.name === 'checkout.loaded') {
              setStatus('Your secure Paddle window is open.');
            } else if (event && event.name === 'checkout.closed') {
              setStatus('The Paddle window was closed. If you still need it, reopen your original link or contact support.');
            } else if (event && event.name === 'checkout.completed') {
              setStatus('The Paddle window has completed. If you have questions about your account, contact support.');
            }
          }
        });
      } catch (_) { paymentScriptFailed(); }
    }
  </script>
  <script src="https://cdn.paddle.com/paddle/v2/paddle.js" onload="startPaymentLink()" onerror="paymentScriptFailed()"></script>
</body>
</html>
